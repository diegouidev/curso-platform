          $ref: '#/components/schemas/ReviewRatingEnum'
      required:
      - rating
    ReviewCard:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        question:
          type: string
          readOnly: true
        answer:
          type: string
          readOnly: true
        due_on:
          type: string
          format: date
          readOnly: true
        interval_days:
          type: integer
          readOnly: true
        repetitions:
          type: integer
          readOnly: true
        lapses:
          type: integer
          readOnly: true
        last_reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        lesson:
          allOf:
          - $ref: '#/components/schemas/CardLesson'
          readOnly: true
      required:
      - answer
      - due_on
      - id
      - interval_days
      - lapses
      - last_reviewed_at
      - lesson
      - question
      - repetitions
    ReviewRatingEnum:
      enum:
      - again
      - hard
      - good
      - easy
      type: string
      description: |-
        * `again` - Errei
        * `hard` - Difícil
        * `good` - Bom
        * `easy` - Fácil
    ReviewSession:
      type: object
      properties:
        due:
          type: integer
          description: Cards due today or earlier.
        new:
          type: integer
          description: Due cards never reviewed.
        total:
          type: integer
          description: Every card.
        reviewed_today:
          type: integer
        next_due_on:
          type: string
          format: date
          nullable: true
          description: Next day after today with cards due.
        cards:
          type: array
          items:
            $ref: '#/components/schemas/ReviewCard'
          description: Due cards, the most overdue first.
      required:
      - cards
      - due
      - new
      - next_due_on
      - reviewed_today
      - total
    SearchCourse:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        thumbnail_url:
          type: string
          nullable: true
          readOnly: true
        is_archived:
          type: boolean
          readOnly: true
      required:
      - id
      - is_archived
      - thumbnail_url
      - title
    SearchLesson:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        section:
          type: string
          readOnly: true
        course_id:
          type: integer
          readOnly: true
        course_title:
          type: string
          readOnly: true
        module_title:
          type: string
          readOnly: true
        missing_in_drive:
          type: boolean
          readOnly: true
        completed:
          type: boolean
          readOnly: true
      required:
      - completed
      - course_id
      - course_title
      - id
      - missing_in_drive
      - module_title
      - section
      - title
    SearchNote:
      type: object
      properties:
        lesson_id:
          type: integer
        lesson_title:
          type: string
        course_id:
          type: integer
        course_title:
          type: string
        snippet:
          type: string
          description: Plain excerpt of the note around the match.
        match_start:
          type: integer
          description: Match offset inside `snippet`.
        match_length:
          type: integer
          description: 0 when the match couldn't be located.
        updated_at:
          type: string
          format: date-time
      required:
      - course_id
      - course_title
      - lesson_id
      - lesson_title
      - match_length
      - match_start
      - snippet
      - updated_at
    SearchResults:
      type: object
      properties:
        query:
          type: string
        courses:
          type: array
          items:
            $ref: '#/components/schemas/SearchCourse'
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/SearchLesson'
        notes:
          type: array
          items:
            $ref: '#/components/schemas/SearchNote'
      required:
      - courses
      - lessons
      - notes
      - query
    StudyCalendar:
      type: object
      properties:
        start:
          type: string
          format: date
          description: A Monday, 52 weeks before the current week.
        end:
          type: string
          format: date
          description: Today.
        days_studied:
          type: integer
        study_seconds:
          type: integer
        days:
          type: array
          items:
            $ref: '#/components/schemas/StudyDay'
          description: Only days with activity, oldest first.
      required:
      - days
      - days_studied
      - end
      - start
      - study_seconds
    StudyDay:
      type: object
      properties:
        date:
          type: string
          format: date
        study_seconds:
          type: integer
        completed:
          type: integer
      required:
      - completed
      - date
      - study_seconds
    StudyPreferences:
      type: object
      properties:
        suggest_completion:
          type: boolean
          description: Offer to mark a lesson as done after enough time on the page.
        suggest_completion_percent:
          type: integer
          maximum: 100
          minimum: 50
          description: Time on the page, as a percentage of the video duration.
        daily_goal_minutes:
          type: integer
          maximum: 720
          minimum: 0
          description: 0 = no daily goal.
        weekly_goal_minutes:
          type: integer
          maximum: 5040
          minimum: 0
          description: 0 = no weekly goal.
        reminder_enabled:
          type: boolean
          description: Send a reminder when nothing was studied by reminder_time.
        reminder_time:
          type: string
          format: time
        reminder_channels:
          type: array
          items:
            $ref: '#/components/schemas/ReminderChannelsEnum'
          readOnly: true
          description: Reminder channels configured on the server (environment variables).
        auto_sync:
          type: boolean
          description: Sync every active course with the Drive once a day.
      required:
      - reminder_channels
    StudyStats:
      type: object
      properties:
        today:
          type: string
          format: date
        week_start:
          type: string
          format: date
          description: Monday of the current week.
        completed_this_week:
          type: integer
        completed_total:
          type: integer
        study_seconds_today:
          type: integer
        study_seconds_this_week:
          type: integer
        study_seconds_total:
          type: integer
        daily_goal_minutes:
          type: integer
          description: 0 = no goal.
        weekly_goal_minutes:
          type: integer
          description: 0 = no goal.
        streak_days:
          type: integer
          description: Consecutive study days ending today (or yesterday, until today
            ends).
        longest_streak_days:
          type: integer
        studied_today:
          type: boolean
        recent_days:
          type: array
          items:
            $ref: '#/components/schemas/StudyDay'
          description: Last 7 days, oldest first.
      required:
      - completed_this_week
      - completed_total
      - daily_goal_minutes
      - longest_streak_days
      - recent_days
      - streak_days
      - studied_today
      - study_seconds_this_week
      - study_seconds_today
      - study_seconds_total
      - today
      - week_start
      - weekly_goal_minutes
    ThumbnailUploadRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: JPEG, PNG, WebP or GIF, up to 5 MB.
      required:
      - file
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          title: Usuário
          description: Obrigatório. 150 caracteres ou menos. Letras, números e @/./+/-/_
            apenas.
        email:
          type: string
          format: email
          readOnly: true
          title: Endereço de email
      required:
      - email
      - id
      - username
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
