openapi: 3.0.3
info:
  title: Curso Platform API
  version: 0.1.0
  description: API pessoal de estudo sobre aulas hospedadas no Google Drive (somente
    leitura).
paths:
  /api/auth/login:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
        '401':
          description: Usuário ou senha inválidos.
  /api/auth/logout:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/me:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/refresh:
    post:
      operationId: auth_refresh_create
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
        '401':
          description: Sessão expirada. Faça login novamente.
  /api/continue:
    get:
      operationId: continue_retrieve
      parameters:
      - in: query
        name: course
        schema:
          type: integer
        description: Only this course (archived or not).
      tags:
      - lessons
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Continue'
          description: ''
  /api/courses:
    get:
      operationId: courses_list
      tags:
      - courses
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Course'
          description: ''
  /api/courses/{id}:
    get:
      operationId: courses_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - courses
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'
          description: ''
    patch:
      operationId: courses_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - courses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCourseUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCourseUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCourseUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'
          description: ''
  /api/courses/{id}/mark-seen:
    post:
      operationId: courses_mark_seen_create
      description: 'Dismisses the "new lessons" notice: lessons added so far stop
        being new.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - courses
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'
          description: ''
  /api/courses/{id}/notebook:
    get:
      operationId: courses_notebook_retrieve
      description: Every note of the course, in course order, to read (or print) in
        one page.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - notes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notebook'
          description: ''
  /api/courses/{id}/recap:
    get:
      operationId: courses_recap_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - courses
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseRecap'
          description: ''
  /api/courses/{id}/reset-order:
    post:
      operationId: courses_reset_order_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - organize
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'
          description: ''
  /api/courses/{id}/sync:
    post:
      operationId: courses_sync_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - courses
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
          description: ''
  /api/courses/{id}/thumbnail:
    put:
      operationId: courses_thumbnail_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - courses
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ThumbnailUploadRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'
          description: ''
    delete:
      operationId: courses_thumbnail_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - courses
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'
          description: ''
  /api/courses/import:
    post:
      operationId: courses_import_create
      tags:
      - courses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseImportRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CourseImportRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CourseImportRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseImportResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseExists'
          description: Folder already imported.
  /api/export:
    get:
      operationId: export_retrieve
      parameters:
      - in: query
        name: course
        schema:
          type: integer
        description: 'md only: notes of this course.'
      - in: query
        name: type
        schema:
          type: string
          enum:
          - json
          - md
        description: 'json: full backup (progress, notes, sessions). md: notes only.'
      tags:
      - backup
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: File download.
  /api/google/callback:
    get:
      operationId: google_callback_retrieve
      description: |-
        Google redirects here (directly on the backend). Authenticated by the one-time
        `state` created in GoogleConnectView, not by the app session.
      parameters:
      - in: query
        name: code
        schema:
          type: string
      - in: query
        name: error
        schema:
          type: string
      - in: query
        name: state
        schema:
          type: string
      tags:
      - google
      security:
      - {}
      responses:
        '302':
          description: Redirect back to the frontend.
  /api/google/connect:
    get:
      operationId: google_connect_retrieve
      description: |-
        Starts the OAuth flow. Opened as a full-page navigation, hence the cookie auth and
        redirects (never JSON) for every outcome.
      parameters:
      - in: query
        name: next
        schema:
          type: string
        description: Frontend path to return to.
      tags:
      - google
      security:
      - jwtAuth: []
      - refreshCookie: []
      - {}
      responses:
        '302':
          description: Redirect to Google consent screen.
  /api/google/disconnect:
    post:
      operationId: google_disconnect_create
      tags:
      - google
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/google/status:
    get:
      operationId: google_status_retrieve
      tags:
      - google
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleStatus'
          description: ''
  /api/health:
    get:
      operationId: health_retrieve
      tags:
      - core
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/import-backup:
    post:
      operationId: import_backup_create
      tags:
      - backup
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BackupUploadRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreStats'
          description: ''
  /api/import-jobs/{id}:
    get:
      operationId: import_jobs_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - courses
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
          description: ''
  /api/lessons/{id}:
    get:
      operationId: lessons_retrieve
      description: GET (player data) comes from LessonDetailView; PATCH edits title/visibility.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - lessons
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonDetail'
          description: ''
    patch:
      operationId: lessons_partial_update
      description: GET (player data) comes from LessonDetailView; PATCH edits title/visibility.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - organize
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedItemUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedItemUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedItemUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonSummary'
          description: ''
  /api/lessons/{id}/complete:
    post:
      operationId: lessons_complete_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - lessons
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonProgress'
          description: ''
    delete:
      operationId: lessons_complete_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - lessons
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/lessons/{id}/heartbeat:
    post:
      operationId: lessons_heartbeat_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - lessons
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeartbeatRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/HeartbeatRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/HeartbeatRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonProgress'
          description: ''
  /api/lessons/{id}/marks:
    patch:
      operationId: lessons_marks_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - lessons
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedLessonMarksRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedLessonMarksRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedLessonMarksRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonProgress'
          description: ''
  /api/lessons/{id}/note:
    get:
      operationId: lessons_note_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - notes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
          description: ''
    put:
      operationId: lessons_note_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - notes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NoteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NoteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
          description: ''
  /api/marked:
    get:
      operationId: marked_list
      parameters:
      - in: query
        name: mark
        schema:
          type: string
          enum:
          - difficult
          - review_later
          - starred
        description: 'Only this mark (default: any).'
      tags:
      - lessons
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarkedLesson'
          description: ''
  /api/modules/{id}:
    patch:
      operationId: modules_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - organize
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedItemUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedItemUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedItemUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Module'
          description: ''
  /api/preferences:
    get:
      operationId: preferences_retrieve
      tags:
      - preferences
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyPreferences'
          description: ''
    patch:
      operationId: preferences_partial_update
      tags:
      - preferences
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedStudyPreferencesRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedStudyPreferencesRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedStudyPreferencesRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyPreferences'
          description: ''
  /api/reminders/test:
    post:
      operationId: reminders_test_create
      tags:
      - preferences
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderTest'
          description: ''
        '400':
          description: No channel.
  /api/reorder:
    post:
      operationId: reorder_create
      tags:
      - organize
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReorderRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReorderRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/review:
    get:
      operationId: review_retrieve
      description: 'Today''s review session: the due cards, the most overdue first.'
      parameters:
      - in: query
        name: course
        schema:
          type: integer
        description: Only cards of this course.
      tags:
      - review
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewSession'
          description: ''
  /api/review/cards/{id}:
    post:
      operationId: review_cards_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - review
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewAnswerRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReviewAnswerRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReviewAnswerRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewCard'
          description: ''
  /api/search:
    get:
      operationId: search_retrieve
      parameters:
      - in: query
        name: q
        schema:
          type: string
        description: At least 2 characters.
      tags:
      - search
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResults'
          description: ''
  /api/stats:
    get:
      operationId: stats_retrieve
      tags:
      - stats
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyStats'
          description: ''
  /api/stats/calendar:
    get:
      operationId: stats_calendar_retrieve
      tags:
      - stats
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyCalendar'
          description: ''
components:
  schemas:
    AccessToken:
      type: object
      properties:
        access:
          type: string
        user:
          $ref: '#/components/schemas/User'
      required:
      - access
      - user
    Attachment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        drive_file_id:
          type: string
          readOnly: true
        mime_type:
          type: string
          readOnly: true
        view_url:
          type: string
          readOnly: true
        preview_url:
          type: string
          readOnly: true
          description: Embeddable preview (iframe).
      required:
      - drive_file_id
      - id
      - mime_type
      - preview_url
      - title
      - view_url
    BackupUploadRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: JSON exported by GET /api/export.
      required:
      - file
    CardLesson:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        course_id:
          type: integer
          readOnly: true
        course_title:
          type: string
          readOnly: true
        module_title:
          type: string
          readOnly: true
      required:
      - course_id
      - course_title
      - id
      - module_title
      - title
    Continue:
      type: object
      properties:
        lesson:
          allOf:
          - $ref: '#/components/schemas/ContinueLesson'
          nullable: true
          description: Null when everything is done.
        reason:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ContinueReasonEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - lesson
      - reason
    ContinueLesson:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        section:
          type: string
          readOnly: true
        duration_seconds:
          type: integer
          readOnly: true
          nullable: true
        course:
          allOf:
          - $ref: '#/components/schemas/CourseRef'
          readOnly: true
        module:
          allOf:
          - $ref: '#/components/schemas/Ref'
          readOnly: true
        progress:
          allOf:
          - $ref: '#/components/schemas/LessonProgress'
          readOnly: true
      required:
      - course
      - duration_seconds
      - id
      - module
      - progress
      - section
      - title
    ContinueReasonEnum:
      enum:
      - resume
      - next
      - start
      type: string
      description: |-
        * `resume` - Aula aberta e não concluída
        * `next` - Próxima aula depois da última concluída
        * `start` - Primeira aula, nada aberto ainda
    Course:
      type: object
      description: |-
        Expects the with_progress() annotations. `plans` in the context (course id -> plan)
        avoids one query per course in lists.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        title_is_custom:
          type: boolean
          readOnly: true
          description: 'Edited by the user: sync keeps it instead of the Drive name.'
        description:
          type: string
          readOnly: true
        drive_folder_id:
          type: string
          readOnly: true
        drive_name_original:
          type: string
          readOnly: true
        drive_url:
          type: string
          readOnly: true
        thumbnail_url:
          type: string
          nullable: true
          readOnly: true
        is_archived:
          type: boolean
          readOnly: true
        clean_titles:
          type: boolean
          readOnly: true
