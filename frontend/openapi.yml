        in the context.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        title_is_custom:
          type: boolean
          readOnly: true
        drive_file_id:
          type: string
          readOnly: true
        drive_name_original:
          type: string
          readOnly: true
        mime_type:
          type: string
          readOnly: true
        duration_seconds:
          type: integer
          readOnly: true
          nullable: true
        is_hidden:
          type: boolean
          readOnly: true
        missing_in_drive:
          type: boolean
          readOnly: true
        embed_url:
          type: string
          readOnly: true
        drive_url:
          type: string
          readOnly: true
        course:
          allOf:
          - $ref: '#/components/schemas/Ref'
          readOnly: true
        module:
          allOf:
          - $ref: '#/components/schemas/Ref'
          readOnly: true
        progress:
          allOf:
          - $ref: '#/components/schemas/LessonProgress'
          readOnly: true
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
          readOnly: true
        module_attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
          readOnly: true
        previous:
          allOf:
          - $ref: '#/components/schemas/LessonRef'
          nullable: true
          readOnly: true
        next:
          allOf:
          - $ref: '#/components/schemas/LessonRef'
          nullable: true
          readOnly: true
        position:
          type: integer
          nullable: true
          readOnly: true
          description: 1-based position among the playable lessons; null for hidden/missing
            ones.
        total:
          type: integer
          readOnly: true
          description: Playable lessons in the course.
      required:
      - attachments
      - course
      - drive_file_id
      - drive_name_original
      - drive_url
      - duration_seconds
      - embed_url
      - id
      - is_hidden
      - mime_type
      - missing_in_drive
      - module
      - module_attachments
      - next
      - position
      - previous
      - progress
      - title
      - title_is_custom
      - total
