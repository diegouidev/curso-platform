services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATA_DIR: /data
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
    volumes:
      - sqlite_data:/data
    # Exposed on the host because the Google OAuth redirect URI is http://localhost:8000/...
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlite_data:
